<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Playlist — Ottfree</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="site-header__bar">
    <a href="home.html" class="brand">Ott<span>free</span></a>
    <nav class="site-nav">
      <a href="home.html" class="nav-link">Home</a>
    </nav>
    <form class="nav-search" data-nav-search>
      <input type="search" placeholder="Search titles…" aria-label="Search" />
      <button type="submit" aria-label="Search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
    </form>
    <div class="nav-auth" data-nav-auth></div>
    <button class="menu-toggle" data-menu-toggle aria-label="Menu">☰</button>
  </div>
</header>

<div class="page-head">
  <div class="page-head__eyebrow"><a href="home.html" class="nav-link">Home</a> · Playlist</div>
  <h1 id="playlist-title" class="skeleton skeleton-text skeleton-text--title">&nbsp;</h1>
  <div class="page-head__tools">
    <form data-playlist-search>
      <input type="search" placeholder="Search this playlist…" aria-label="Search this playlist" />
    </form>
  </div>
</div>

<div id="folders-slot"></div>
<div class="section-label" id="files-label" style="display:none">Titles</div>
<div class="grid" id="grid"></div>
<div class="load-more" id="load-more"></div>

<footer class="site-footer">
  <span>Ottfree · a personal streaming index</span>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/playlist.js"></script>
</body>
</html>
